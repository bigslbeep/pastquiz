<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>과거형 뜻맞추기 게임</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#1f342c;
    --board-2:#25443a;
    --chalk:#f4ecd8;
    --chalk-dim:#cfc6ae;
    --yellow:#ffcf56;
    --coral:#ff7a6b;
    --sky:#5ec8e0;
    --teal:#4fd6a8;
    --ink:#16241d;
    --line: rgba(244,236,216,0.18);
    --shadow: 0 10px 24px rgba(0,0,0,0.35);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 10%, rgba(244,236,216,0.05), transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(244,236,216,0.05), transparent 45%),
      var(--board);
    color:var(--chalk);
    font-family:'Noto Sans KR', sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 16px 60px;
  }
  .brand{
    font-family:'Gaegu', 'Noto Sans KR', sans-serif;
    font-weight:700;
    font-size:clamp(28px, 5vw, 40px);
    letter-spacing:.5px;
    margin:4px 0 2px;
    text-align:center;
  }
  .brand .dot{ color:var(--yellow); }
  .tagline{
    color:var(--chalk-dim);
    font-size:14px;
    text-align:center;
    margin-bottom:28px;
  }
  .chalk-rule{
    width:120px; height:3px; border-radius:3px;
    background:repeating-linear-gradient(90deg, var(--chalk-dim) 0 8px, transparent 8px 14px);
    opacity:.5; margin-bottom:26px;
  }

  /* ---------- Panels ---------- */
  .panel{
    width:100%;
    max-width:640px;
    background:var(--board-2);
    border:1px solid var(--line);
    border-radius:22px;
    box-shadow:var(--shadow);
    padding:26px 22px 30px;
  }
  .hidden{ display:none !important; }

  .section-label{
    font-family:'Gaegu','Noto Sans KR',sans-serif;
    font-weight:700;
    font-size:19px;
    color:var(--yellow);
    margin:0 0 12px;
  }
  .section-label small{
    display:block;
    font-family:'Noto Sans KR',sans-serif;
    font-weight:400;
    font-size:12.5px;
    color:var(--chalk-dim);
    margin-top:3px;
  }

  .choice-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
    margin-bottom:24px;
  }
  .choice-btn{
    appearance:none;
    border:1.5px solid var(--line);
    background:rgba(244,236,216,0.04);
    color:var(--chalk);
    border-radius:14px;
    padding:12px 8px 10px;
    font-family:inherit;
    font-size:14px;
    font-weight:500;
    line-height:1.3;
    cursor:pointer;
    transition:transform .12s ease, border-color .12s ease, background .12s ease;
    text-align:center;
  }
  .choice-btn .g-num{
    display:block;
    font-family:'Gaegu','Noto Sans KR',sans-serif;
    font-size:20px;
    font-weight:700;
    margin-bottom:2px;
  }
  .choice-btn:hover{ transform:translateY(-2px); border-color:var(--chalk-dim); }
  .choice-btn.active{
    background:var(--yellow);
    color:var(--ink);
    border-color:var(--yellow);
    font-weight:700;
  }
  .choice-btn.active .g-num{ color:var(--ink); }

  .count-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:8px;
  }
  .count-btn{
    appearance:none;
    border:1.5px solid var(--line);
    background:rgba(244,236,216,0.04);
    color:var(--chalk);
    border-radius:12px;
    padding:9px 16px;
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    transition:transform .12s ease, border-color .12s ease, background .12s ease;
  }
  .count-btn:hover{ transform:translateY(-2px); border-color:var(--chalk-dim); }
  .count-btn.active{ background:var(--teal); color:var(--ink); border-color:var(--teal); }

  .start-btn{
    appearance:none;
    width:100%;
    margin-top:22px;
    border:none;
    border-radius:16px;
    padding:15px 10px;
    background:var(--coral);
    color:#2a1310;
    font-family:'Gaegu','Noto Sans KR',sans-serif;
    font-weight:700;
    font-size:20px;
    letter-spacing:.5px;
    cursor:pointer;
    box-shadow:0 8px 0 #b6453b;
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .start-btn:active{ transform:translateY(6px); box-shadow:0 2px 0 #b6453b; }
  .start-btn:disabled{ opacity:.45; cursor:not-allowed; box-shadow:none; }

  /* ---------- Game screen ---------- */
  .game-wrap{ width:100%; max-width:820px; }
  .hud{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .hud-left{ display:flex; align-items:center; gap:10px; }
  .back-btn{
    appearance:none;
    border:1.5px solid var(--line);
    background:rgba(244,236,216,0.04);
    color:var(--chalk);
    border-radius:12px;
    padding:8px 14px;
    font-family:inherit;
    font-size:13px;
    cursor:pointer;
  }
  .back-btn:hover{ border-color:var(--chalk-dim); }
  .group-tag{
    font-family:'Gaegu','Noto Sans KR',sans-serif;
    font-weight:700;
    font-size:16px;
    color:var(--yellow);
  }
  .stat-row{ display:flex; gap:14px; }
  .stat{
    background:rgba(244,236,216,0.06);
    border:1px solid var(--line);
    border-radius:12px;
    padding:7px 14px;
    font-size:13px;
    text-align:center;
    min-width:64px;
  }
  .stat b{
    display:block;
    font-family:'Gaegu','Noto Sans KR',sans-serif;
    font-size:18px;
    color:var(--chalk);
  }

  .board{
    display:grid;
    gap:10px;
    grid-template-columns:repeat(4, 1fr);
  }
  @media (min-width:520px){ .board{ grid-template-columns:repeat(5, 1fr); } }
  @media (min-width:680px){ .board{ grid-template-columns:repeat(6, 1fr); } }

  .card{
    aspect-ratio:3/4;
    perspective:800px;
    cursor:pointer;
  }
  .card-inner{
    position:relative;
    width:100%; height:100%;
    transform-style:preserve-3d;
    transition:transform .45s cubic-bezier(.4,.2,.2,1);
  }
  .card.flipped .card-inner{ transform:rotateY(180deg); }
  .card.matched .card-inner{ transform:rotateY(180deg); }
  .card.matched{ cursor:default; }
  .card.matched .card-face.front{
    box-shadow:0 0 0 2px var(--teal), var(--shadow);
  }
  .card.shake .card-inner{ animation:shake .4s; }
  @keyframes shake{
    20%{ transform:rotateY(180deg) translateX(-6px); }
    40%{ transform:rotateY(180deg) translateX(6px); }
    60%{ transform:rotateY(180deg) translateX(-4px); }
    80%{ transform:rotateY(180deg) translateX(4px); }
    100%{ transform:rotateY(180deg) translateX(0); }
  }

  .card-face{
    position:absolute; inset:0;
    border-radius:12px;
    backface-visibility:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:6px 4px;
    box-shadow:var(--shadow);
  }
  .card-face.back{
    background:
      repeating-linear-gradient(135deg, rgba(244,236,216,0.05) 0 6px, transparent 6px 12px),
      var(--board-2);
    border:1.5px solid var(--line);
    font-size:22px;
    color:var(--chalk-dim);
  }
  .card-face.front{
    transform:rotateY(180deg);
    flex-direction:column;
    gap:4px;
    border:none;
  }
  .card-face.front.word{ background:var(--coral); color:#2a1310; }
  .card-face.front.meaning{ background:var(--sky); color:#0c2b33; }
  .front .main-text{
    font-family:'Gaegu','Noto Sans KR',sans-serif;
    font-weight:700;
    font-size:clamp(13px, 3.4vw, 18px);
    line-height:1.15;
    word-break:keep-all;
  }
  .front .sub-text{
    font-size:10.5px;
    opacity:.75;
    font-weight:500;
  }

  /* ---------- Win overlay ---------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(10,16,13,0.72);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:20;
  }
  .win-card{
    background:var(--board-2);
    border:1px solid var(--line);
    border-radius:22px;
    padding:30px 26px;
    max-width:360px;
    width:100%;
    text-align:center;
    box-shadow:var(--shadow);
  }
  .win-emoji{ font-size:42px; margin-bottom:6px; }
  .win-title{
    font-family:'Gaegu','Noto Sans KR',sans-serif;
    font-weight:700;
    font-size:24px;
    color:var(--yellow);
    margin:0 0 4px;
  }
  .win-sub{ color:var(--chalk-dim); font-size:13px; margin-bottom:18px; }
  .win-stats{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-bottom:8px;
  }
  .win-stats .stat{ min-width:76px; }
  .best-note{
    font-size:12.5px;
    color:var(--teal);
    margin:10px 0 20px;
    min-height:16px;
    font-weight:700;
  }
  .win-actions{ display:flex; gap:10px; }
  .win-actions button{
    flex:1;
    appearance:none;
    border:none;
    border-radius:13px;
    padding:12px 8px;
    font-family:'Gaegu','Noto Sans KR',sans-serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
  }
  .win-actions .again{ background:var(--coral); color:#2a1310; }
  .win-actions .menu{ background:rgba(244,236,216,0.1); color:var(--chalk); border:1px solid var(--line) !important; }

  footer{
    margin-top:34px;
    color:var(--chalk-dim);
    font-size:11.5px;
    opacity:.6;
    text-align:center;
  }
</style>
</head>
<body>

  <div class="brand">과거형 뜻맞추기<span class="dot">.</span></div>
  <div class="tagline">영어 과거형 카드를 뒤집어 알맞은 뜻을 찾아보세요</div>
  <div class="chalk-rule"></div>

  <!-- ===== Start screen ===== -->
  <div class="panel" id="screen-start">
    <p class="section-label">1. 연습할 그룹을 골라보세요
      <small id="group-desc">그룹을 선택하면 아래에서 카드 수를 정할 수 있어요</small>
    </p>
    <div class="choice-grid" id="group-grid"></div>

    <p class="section-label">2. 카드 수(짝 개수)</p>
    <div class="count-row" id="count-row"></div>

    <button class="start-btn" id="start-btn" disabled>게임 시작!</button>
  </div>

  <!-- ===== Game screen ===== -->
  <div class="game-wrap hidden" id="screen-game">
    <div class="hud">
      <div class="hud-left">
        <button class="back-btn" id="back-btn">← 그룹 선택</button>
        <span class="group-tag" id="hud-group"></span>
      </div>
      <div class="stat-row">
        <div class="stat">시간<b id="hud-time">00:00</b></div>
        <div class="stat">시도<b id="hud-moves">0</b></div>
        <div class="stat">짝<b id="hud-pairs">0/0</b></div>
      </div>
    </div>
    <div class="board" id="board"></div>
  </div>

  <footer>Made for 5학년 영어 과거형 학습 · 원형–과거형–뜻 자료 기반</footer>

  <!-- ===== Win overlay ===== -->
  <div class="overlay hidden" id="overlay">
    <div class="win-card">
      <div class="win-emoji">🎉</div>
      <p class="win-title">모두 맞췄어요!</p>
      <p class="win-sub" id="win-group-name"></p>
      <div class="win-stats">
        <div class="stat">시간<b id="win-time">00:00</b></div>
        <div class="stat">시도<b id="win-moves">0</b></div>
      </div>
      <p class="best-note" id="win-best"></p>
      <div class="win-actions">
        <button class="again" id="again-btn">다시하기</button>
        <button class="menu" id="menu-btn">그룹 선택</button>
      </div>
    </div>
  </div>

<script>
(function(){
  "use strict";

  /* ---------------- Vocabulary data ---------------- */
  // [원형, 과거형, 뜻]
  const GROUPS = [
    { id:"g1", label:"① 모음 변화", tip:"가운데 모음만 바뀌어요", items:[
      ["sing","sang","노래하다"],["swim","swam","수영하다"],["drink","drank","마시다"],
      ["ring","rang","울리다"],["begin","began","시작하다"],["run","ran","달리다"],
      ["give","gave","주다"],["eat","ate","먹다"],["see","saw","보다"],["sit","sat","앉다"],
    ]},
    { id:"g2", label:"② -ought/-aught", tip:"'-ought/-aught' 소리로 끝나요", items:[
      ["buy","bought","사다"],["bring","brought","가져오다"],["think","thought","생각하다"],
      ["fight","fought","싸우다"],["catch","caught","잡다"],["teach","taught","가르치다"],
    ]},
    { id:"g3", label:"③ 원형=과거형", tip:"변하지 않아요", items:[
      ["put","put","놓다"],["cut","cut","자르다"],["read","read","읽다"],
      ["hit","hit","치다"],["let","let","시키다"],["hurt","hurt","다치게 하다"],
    ]},
    { id:"g4", label:"④ -d/-t 변화", tip:"끝소리가 -d/-t 로 바뀌어요", items:[
      ["have","had","가지다"],["make","made","만들다"],["find","found","찾다"],["stand","stood","서다"],
      ["understand","understood","이해하다"],["send","sent","보내다"],["spend","spent","쓰다"],["build","built","짓다"],
    ]},
    { id:"g5", label:"⑤ 완전 불규칙", tip:"규칙 없이 따로 암기!", items:[
      ["go","went","가다"],["come","came","오다"],["do","did","하다"],["say","said","말하다"],
      ["tell","told","말해주다"],["get","got","얻다"],["take","took","가지고 가다"],["know","knew","알다"],
      ["write","wrote","쓰다"],["fly","flew","날다"],["grow","grew","자라다"],["draw","drew","그리다"],
      ["fall","fell","넘어지다"],["feel","felt","느끼다"],["meet","met","만나다"],["lose","lost","잃다"],
      ["sleep","slept","자다"],["wear","wore","입다"],["break","broke","깨다"],["speak","spoke","말하다"],
      ["ride","rode","타다"],["leave","left","떠나다"],
    ]},
  ];
  const ALL_ITEMS = GROUPS.flatMap(g => g.items);
  const COUNT_OPTIONS = [6, 8, 10, 12];

  /* ---------------- State ---------------- */
  let state = {
    groupId: null,   // one of GROUPS[].id or "all"
    count: null,
    deck: [],
    flipped: [],
    matchedPairs: 0,
    totalPairs: 0,
    moves: 0,
    timer: null,
    seconds: 0,
    lock: false,
  };

  /* ---------------- Elements ---------------- */
  const groupGrid   = document.getElementById("group-grid");
  const groupDesc   = document.getElementById("group-desc");
  const countRow    = document.getElementById("count-row");
  const startBtn    = document.getElementById("start-btn");
  const screenStart = document.getElementById("screen-start");
  const screenGame  = document.getElementById("screen-game");
  const board       = document.getElementById("board");
  const hudGroup    = document.getElementById("hud-group");
  const hudTime     = document.getElementById("hud-time");
  const hudMoves    = document.getElementById("hud-moves");
  const hudPairs    = document.getElementById("hud-pairs");
  const backBtn     = document.getElementById("back-btn");
  const overlay     = document.getElementById("overlay");
  const winTime     = document.getElementById("win-time");
  const winMoves    = document.getElementById("win-moves");
  const winGroupName= document.getElementById("win-group-name");
  const winBest     = document.getElementById("win-best");
  const againBtn    = document.getElementById("again-btn");
  const menuBtn     = document.getElementById("menu-btn");

  /* ---------------- Build start screen choices ---------------- */
  function groupMaxCount(id){
    if(id === "all") return ALL_ITEMS.length;
    const g = GROUPS.find(x => x.id === id);
    return g.items.length;
  }
  function groupLabel(id){
    if(id === "all") return "전체 랜덤";
    return GROUPS.find(x => x.id === id).label;
  }

  GROUPS.forEach(g => {
    const btn = document.createElement("button");
    btn.className = "choice-btn";
    btn.dataset.id = g.id;
    btn.innerHTML = `<span class="g-num">${g.label.split(" ")[0]}</span>${g.label.split(" ").slice(1).join(" ")}`;
    btn.addEventListener("click", () => selectGroup(g.id));
    groupGrid.appendChild(btn);
  });
  const allBtn = document.createElement("button");
  allBtn.className = "choice-btn";
  allBtn.dataset.id = "all";
  allBtn.innerHTML = `<span class="g-num">★</span>전체 랜덤 (50개)`;
  allBtn.addEventListener("click", () => selectGroup("all"));
  groupGrid.appendChild(allBtn);

  function selectGroup(id){
    state.groupId = id;
    state.count = null;
    [...groupGrid.children].forEach(b => b.classList.toggle("active", b.dataset.id === id));
    const g = id === "all" ? null : GROUPS.find(x => x.id === id);
    groupDesc.textContent = id === "all"
      ? "모든 그룹에서 무작위로 섞어서 출제해요"
      : g.tip;
    buildCountRow();
    startBtn.disabled = true;
  }

  function buildCountRow(){
    countRow.innerHTML = "";
    const max = groupMaxCount(state.groupId);
    let options = COUNT_OPTIONS.filter(n => n <= max);
    if(options.length === 0 || options[options.length-1] < max){
      // always allow using the group's full size too
      if(!options.includes(max)) options.push(max);
    }
    options.forEach(n => {
      const b = document.createElement("button");
      b.className = "count-btn";
      b.textContent = n + "쌍";
      b.addEventListener("click", () => {
        state.count = n;
        [...countRow.children].forEach(c => c.classList.remove("active"));
        b.classList.add("active");
        startBtn.disabled = false;
      });
      countRow.appendChild(b);
    });
  }

  startBtn.addEventListener("click", () => {
    if(!state.groupId || !state.count) return;
    startGame();
  });

  /* ---------------- Game logic ---------------- */
  function shuffle(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function pickItems(){
    const pool = state.groupId === "all" ? ALL_ITEMS : GROUPS.find(g => g.id === state.groupId).items;
    return shuffle(pool).slice(0, state.count);
  }

  function startGame(){
    const items = pickItems();
    state.totalPairs = items.length;
    state.matchedPairs = 0;
    state.moves = 0;
    state.seconds = 0;
    state.flipped = [];
    state.lock = false;
    clearInterval(state.timer);
    state.timer = null;

    const cards = [];
    items.forEach((item, idx) => {
      cards.push({ pairId: idx, type: "word", main: item[1], sub: item[0] });
      cards.push({ pairId: idx, type: "meaning", main: item[2], sub: "" });
    });
    state.deck = shuffle(cards);

    hudGroup.textContent = groupLabel(state.groupId) + " · " + state.count + "쌍";
    hudTime.textContent = "00:00";
    hudMoves.textContent = "0";
    hudPairs.textContent = `0/${state.totalPairs}`;

    renderBoard();
    screenStart.classList.add("hidden");
    screenGame.classList.remove("hidden");
    overlay.classList.add("hidden");
  }

  function renderBoard(){
    board.innerHTML = "";
    state.deck.forEach((c, i) => {
      const card = document.createElement("div");
      card.className = "card";
      card.dataset.index = i;
      card.innerHTML = `
        <div class="card-inner">
          <div class="card-face back">📖</div>
          <div class="card-face front ${c.type}">
            <span class="main-text">${c.main}</span>
            ${c.sub ? `<span class="sub-text">(${c.sub})</span>` : ""}
          </div>
        </div>`;
      card.addEventListener("click", () => onCardClick(i, card));
      board.appendChild(card);
    });
  }

  function startTimerIfNeeded(){
    if(state.timer) return;
    state.timer = setInterval(() => {
      state.seconds++;
      hudTime.textContent = formatTime(state.seconds);
    }, 1000);
  }

  function formatTime(s){
    const m = Math.floor(s / 60).toString().padStart(2, "0");
    const sec = (s % 60).toString().padStart(2, "0");
    return `${m}:${sec}`;
  }

  function onCardClick(i, el){
    if(state.lock) return;
    if(el.classList.contains("flipped") || el.classList.contains("matched")) return;
    if(state.flipped.length === 2) return;

    startTimerIfNeeded();
    el.classList.add("flipped");
    state.flipped.push({ i, el });

    if(state.flipped.length === 2){
      state.moves++;
      hudMoves.textContent = state.moves;
      const [a, b] = state.flipped;
      const cardA = state.deck[a.i], cardB = state.deck[b.i];

      if(cardA.pairId === cardB.pairId && cardA.type !== cardB.type){
        state.lock = true;
        setTimeout(() => {
          a.el.classList.add("matched");
          b.el.classList.add("matched");
          state.flipped = [];
          state.lock = false;
          state.matchedPairs++;
          hudPairs.textContent = `${state.matchedPairs}/${state.totalPairs}`;
          if(state.matchedPairs === state.totalPairs){
            finishGame();
          }
        }, 380);
      } else {
        state.lock = true;
        a.el.classList.add("shake");
        b.el.classList.add("shake");
        setTimeout(() => {
          a.el.classList.remove("flipped", "shake");
          b.el.classList.remove("flipped", "shake");
          state.flipped = [];
          state.lock = false;
        }, 800);
      }
    }
  }

  function bestKey(){
    return `ptmg_best_${state.groupId}_${state.count}`;
  }

  function finishGame(){
    clearInterval(state.timer);
    state.timer = null;

    winGroupName.textContent = groupLabel(state.groupId) + " · " + state.count + "쌍";
    winTime.textContent = formatTime(state.seconds);
    winMoves.textContent = state.moves;

    let best = null;
    try{ best = JSON.parse(localStorage.getItem(bestKey()) || "null"); }catch(e){ best = null; }

    let isNewBest = false;
    if(!best || state.moves < best.moves || (state.moves === best.moves && state.seconds < best.seconds)){
      isNewBest = true;
      try{
        localStorage.setItem(bestKey(), JSON.stringify({ moves: state.moves, seconds: state.seconds }));
      }catch(e){ /* localStorage unavailable — ignore */ }
    }

    if(isNewBest){
      winBest.textContent = "🏆 새로운 최고 기록이에요!";
    } else if(best){
      winBest.textContent = `최고 기록: ${formatTime(best.seconds)} · ${best.moves}회`;
    } else {
      winBest.textContent = "";
    }

    setTimeout(() => overlay.classList.remove("hidden"), 300);
  }

  /* ---------------- Navigation ---------------- */
  function goToMenu(){
    clearInterval(state.timer);
    state.timer = null;
    overlay.classList.add("hidden");
    screenGame.classList.add("hidden");
    screenStart.classList.remove("hidden");
  }

  backBtn.addEventListener("click", goToMenu);
  menuBtn.addEventListener("click", goToMenu);
  againBtn.addEventListener("click", () => {
    overlay.classList.add("hidden");
    startGame();
  });

})();
</script>
</body>
</html>
